name: Build luxinaios iOS Dylib & IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: |
        sudo xcode-select -s /Applications/Xcode_15.0.1.app || sudo xcode-select -s /Applications/Xcode.app
        xcodebuild -version
        xcrun --sdk iphoneos --show-sdk-path

    - name: Compile luxinaios.dylib (ARM64 iOS)
      run: |
        mkdir -p build
        clang++ -target arm64-apple-ios14.0 -fobjc-arc -shared -std=c++20 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -Isrc -Isrc/ui -Isrc/core -Isrc/env -Isrc/config \
          -framework UIKit -framework Foundation -framework QuartzCore -framework WebKit \
          -o build/luxinaios.dylib \
          src/entry.mm \
          src/ui/LuxinaUI.mm \
          src/core/LuxinaCore.cpp \
          src/env/LuxinaEnv.cpp
        
        echo "luxinaios.dylib build successful:"
        ls -lh build/luxinaios.dylib
        file build/luxinaios.dylib

    - name: Upload Dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: luxinaios-dylib
        path: build/luxinaios.dylib
