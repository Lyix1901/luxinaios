name: Build luxinaios iOS Dylib & IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile ARM64 iOS Dylib
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Clang & LLD
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y clang lld llvm

    - name: Download iOS SDK
      run: |
        git clone --depth 1 https://github.com/theos/sdks.git $HOME/theos-sdks
        echo "SDK downloaded successfully."

    - name: Compile luxinaios.dylib (ARM64 iOS)
      run: |
        mkdir -p build
        SDK_PATH="$HOME/theos-sdks/iPhoneOS16.5.sdk"
        clang++ -target arm64-apple-ios14.0 -shared -fobjc-arc -std=c++20 \
          -fuse-ld=lld \
          -isysroot "$SDK_PATH" \
          -Isrc -Isrc/ui -Isrc/core -Isrc/env -Isrc/config \
          -L"$SDK_PATH/usr/lib" \
          -F"$SDK_PATH/System/Library/Frameworks" \
          -nodefaultlibs -lc++ -lobjc -lSystem \
          -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics -framework WebKit \
          -Wl,-install_name,@executable_path/Frameworks/luxinaios.dylib \
          -o build/luxinaios.dylib \
          src/entry.mm \
          src/ui/LuxinaUI.mm \
          src/core/LuxinaCore.cpp \
          src/env/LuxinaEnv.mm
        
        echo "luxinaios.dylib build successful:"
        ls -lh build/luxinaios.dylib
        file build/luxinaios.dylib

    - name: Upload Dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: luxinaios-dylib
        path: build/luxinaios.dylib
